# Bump the version, update the changelog, tag, and draft a release.
#
# Delegates to the shared reusable workflow:
# https://github.com/climate-resource/github-actions

name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump_rule:
        type: choice
        description: How to bump the version (stable converts the dev version to a stable release)
        required: true
        options:
          - stable
          - patch
          - minor
          - major
          - "patch alpha"
          - "patch beta"
          - "patch rc"
          - "minor alpha"
          - "minor beta"
          - "minor rc"
          - "major alpha"
          - "major beta"
          - "major rc"
      pre_release_base:
        type: choice
        description: Base bump applied before the pre-release segment on main
        required: false
        default: patch
        options: [patch, minor, major, none]
      pre_release_bump:
        type: choice
        description: Pre-release segment for the post-tag commit on main
        required: false
        default: dev
        options: [dev, alpha, beta, rc, none]
      update_changelog:
        type: boolean
        description: Run towncrier to update the CHANGELOG before tagging
        required: false
        default: true

jobs:
  bump:
    uses: climate-resource/github-actions/.github/workflows/bump.yaml@v1
    permissions:
      contents: write
    with:
      bump-rule: ${{ inputs.bump_rule }}
      pre-release-bump: ${{ inputs.pre_release_bump }}
      pre-release-base: ${{ inputs.pre_release_base }}
      update-changelog: ${{ inputs.update_changelog }}
      python-version: "3.13"
      create-release: true
      release-draft: false
      release-changelog-path: CHANGELOG.md
    secrets:
      token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
