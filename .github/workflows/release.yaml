# Publish the wheel to PyPI and the image to ghcr on a version tag.
#
# The tag is created by the bump workflow, so a release is a deliberate act by
# somebody with write access rather than a side effect of a merge.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity, so there is
      # no long-lived API token to hold or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: climate-resource/github-actions/setup-uv@v1
        with:
          python-version: "3.13"
      - run: uv build
      - name: Check the built wheel installs and runs
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            paperless-archive --help
      - uses: pypa/gh-action-pypi-publish@release/v1

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
